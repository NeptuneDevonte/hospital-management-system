<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background / Base Canvas -->
    <style>
      .glow-node { animation: pulse 3s infinite alternate; }
      .synapse-line { stroke-dasharray: 4 2; }
    </style>

    <!-- Deep Cyan to Electric Blue Main Gradient -->
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="30%" stop-color="#00A896" />
      <stop offset="70%" stop-color="#028090" />
      <stop offset="100%" stop-color="#03045E" />
    </linearGradient>

    <!-- Glowing Electric Line Gradient -->
    <linearGradient id="electricGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077B6" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#80E5FF" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Soft Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#03045E" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Solid White Background -->
  <rect width="512" height="512" fill="#FFFFFF" />

  <g filter="url(#shadow)">
    <!-- ==================== LEFT HEMISPHERE ==================== -->
    <!-- Outer Brain Silhouette - Left Hemisphere -->
    <path d="M 246 96 
             C 210 96 170 110 140 135 
             C 110 160 90 200 90 240 
             C 90 265 98 290 112 310 
             C 100 330 96 355 106 378 
             C 118 402 142 416 168 416 
             C 185 416 202 408 215 396 
             C 228 410 240 416 246 416 
             L 246 96 Z" 
          fill="url(#brainGrad)" 
          opacity="0.12" />

    <!-- Brain Lobe Curves / Contour Silhouette - Left Side -->
    <path d="M 246 96 
             C 200 96 160 115 132 144
             C 104 173 88 212 88 252
             C 88 278 96 304 110 326
             C 102 346 104 370 116 388
             C 130 408 154 420 178 420
             C 198 420 216 410 230 396
             C 238 404 246 408 246 408" 
          fill="none" 
          stroke="url(#brainGrad)" 
          stroke-width="5" 
          stroke-linecap="round" />

    <!-- ==================== RIGHT HEMISPHERE ==================== -->
    <!-- Outer Brain Silhouette - Right Hemisphere -->
    <path d="M 266 96 
             C 302 96 342 110 372 135 
             C 402 160 422 200 422 240 
             C 422 265 414 290 400 310 
             C 412 330 416 355 406 378 
             C 394 402 370 416 344 416 
             C 327 416 310 408 297 396 
             C 284 410 272 416 266 416 
             L 266 96 Z" 
          fill="url(#brainGrad)" 
          opacity="0.12" />

    <!-- Brain Lobe Curves / Contour Silhouette - Right Side -->
    <path d="M 266 96 
             C 312 96 352 115 380 144
             C 408 173 424 212 424 252
             C 424 278 416 304 402 326
             C 410 346 408 370 396 388
             C 382 408 358 420 334 420
             C 314 420 296 410 282 396
             C 274 404 266 408 266 408" 
          fill="none" 
          stroke="url(#brainGrad)" 
          stroke-width="5" 
          stroke-linecap="round" />

    <!-- Central Fissure Division -->
    <line x1="256" y1="84" x2="256" y2="428" stroke="url(#electricGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.4" />

    <!-- ==================== SYNAPTIC NERVE NETWORK (NEURAL MAPPING) ==================== -->
    <!-- Primary Neural Axon Pathways (Left Hemisphere) -->
    <g fill="none" stroke="url(#electricGrad)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 246 130 L 195 145 L 150 180 L 125 230 L 140 285 L 185 300 L 246 290" stroke-width="2.5" />
      <path d="M 195 145 L 210 200 L 185 250 L 140 285" stroke-width="2" />
      <path d="M 150 180 L 180 215 L 235 210 L 246 170" stroke-width="2" />
      <path d="M 125 230 L 170 235 L 185 250 L 220 340 L 246 360" stroke-width="2" />
      <path d="M 140 285 L 130 340 L 165 375 L 210 355 L 220 340" stroke-width="2" />
      <path d="M 185 300 L 210 355" stroke-width="1.5" />
      <path d="M 210 200 L 246 240 L 235 210" stroke-width="1.5" />
    </g>

    <!-- Primary Neural Axon Pathways (Right Hemisphere - Symmetrical & Dynamic) -->
    <g fill="none" stroke="url(#electricGrad)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 266 130 L 317 145 L 362 180 L 387 230 L 372 285 L 327 300 L 266 290" stroke-width="2.5" />
      <path d="M 317 145 L 302 200 L 327 250 L 372 285" stroke-width="2" />
      <path d="M 362 180 L 332 215 L 277 210 L 266 170" stroke-width="2" />
      <path d="M 387 230 L 342 235 L 327 250 L 292 340 L 266 360" stroke-width="2" />
      <path d="M 372 285 L 382 340 L 347 375 L 302 355 L 292 340" stroke-width="2" />
      <path d="M 327 300 L 302 355" stroke-width="1.5" />
      <path d="M 302 200 L 266 240 L 277 210" stroke-width="1.5" />
    </g>

    <!-- Inter-hemispheric Synaptic Cross-Bridges (Corpus Callosum Connections) -->
    <g fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8">
      <path d="M 246 170 L 266 170" />
      <path d="M 246 240 L 266 240" />
      <path d="M 246 290 L 266 290" />
      <path d="M 246 360 L 266 360" />
    </g>

    <!-- ==================== SYNAPSE NODES / NEURAL JUNCTIONS ==================== -->
    <!-- Major Synaptic Nodes with Glow Effect -->
    <g fill="#00E5FF" filter="url(#cyanGlow)">
      <!-- Left Nodes -->
      <circle cx="246" cy="130" r="4.5" />
      <circle cx="195" cy="145" r="4" />
      <circle cx="150" cy="180" r="4.5" />
      <circle cx="125" cy="230" r="5" />
      <circle cx="140" cy="285" r="4.5" />
      <circle cx="185" cy="300" r="4" />
      <circle cx="210" cy="200" r="4" />
      <circle cx="180" cy="215" r="3.5" />
      <circle cx="235" cy="210" r="4" />
      <circle cx="170" cy="235" r="3.5" />
      <circle cx="185" cy="250" r="4" />
      <circle cx="220" cy="340" r="4.5" />
      <circle cx="165" cy="375" r="4" />
      <circle cx="210" cy="355" r="3.5" />

      <!-- Right Nodes -->
      <circle cx="266" cy="130" r="4.5" />
      <circle cx="317" cy="145" r="4" />
      <circle cx="362" cy="180" r="4.5" />
      <circle cx="387" cy="230" r="5" />
      <circle cx="372" cy="285" r="4.5" />
      <circle cx="327" cy="300" r="4" />
      <circle cx="302" cy="200" r="4" />
      <circle cx="332" cy="215" r="3.5" />
      <circle cx="277" cy="210" r="4" />
      <circle cx="342" cy="235" r="3.5" />
      <circle cx="327" cy="250" r="4" />
      <circle cx="292" cy="340" r="4.5" />
      <circle cx="347" cy="375" r="4" />
      <circle cx="302" cy="355" r="3.5" />
    </g>

    <!-- Minor Synaptic Signal Pulse Points (Deep Blue & White Highlights) -->
    <g fill="#FFFFFF">
      <circle cx="195" cy="145" r="1.5" />
      <circle cx="125" cy="230" r="2" />
      <circle cx="220" cy="340" r="1.5" />
      <circle cx="317" cy="145" r="1.5" />
      <circle cx="387" cy="230" r="2" />
      <circle cx="292" cy="340" r="1.5" />
    </g>

    <!-- Outer Signal Radiating Rays (Conceptual Thought / Brainwave Output) -->
    <g stroke="url(#electricGrad)" stroke-width="2" stroke-linecap="round" opacity="0.6">
      <line x1="110" y1="160" x2="85" y2="140" />
      <line x1="80" y1="220" x2="55" y2="210" />
      <line x1="90" y1="300" x2="65" y2="310" />
      
      <line x1="402" y1="160" x2="427" y2="140" />
      <line x1="432" y1="220" x2="457" y2="210" />
      <line x1="422" y1="300" x2="447" y2="310" />
    </g>
  </g>
</svg>
