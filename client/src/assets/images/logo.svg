<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for subtle depth if needed, default transparent/white clean theme -->
    <linearGradient id="tealToBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C9A7" />
      <stop offset="40%" stop-color="#00A896" />
      <stop offset="100%" stop-color="#028090" />
    </linearGradient>

    <!-- Primary Vertical Stem Gradient: Surgical Teal -> Deep Navy -->
    <linearGradient id="leftStemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="40%" stop-color="#0077B6" />
      <stop offset="100%" stop-color="#03045E" />
    </linearGradient>

    <!-- Right Vertical Stem Gradient (Slightly deeper contrast) -->
    <linearGradient id="rightStemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C9A7" />
      <stop offset="50%" stop-color="#0077B6" />
      <stop offset="100%" stop-color="#023E8A" />
    </linearGradient>

    <!-- Cross Horizontal Bar & Center Flow Gradient -->
    <linearGradient id="crossBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#00A896" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>

    <!-- Accent Dynamic Ribbon (Top Right Cross Arm to Bridge) -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077B6" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Soft Drop Shadow for Depth & Layering -->
    <filter id="subtleShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#03045E" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00B4D8" flood-opacity="0.08" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background (Solid Clean White) -->
  <rect width="512" height="512" fill="#FFFFFF" />

  <!-- Main Symbol Group -->
  <g filter="url(#subtleShadow)">
    
    <!-- Outer Shield / Container Contour (Optional subtle framing cut for hospital identity) -->
    <!-- Smooth Seamless Combined 'H' and Medical Cross Geometry -->
    
    <!-- LEFT VERTICAL PILLAR OF 'H' (Seamlessly incorporates Left Arm of Medical Cross) -->
    <path d="M 136 96 
             C 136 82.745 146.745 72 160 72 
             L 192 72 
             C 205.255 72 216 82.745 216 96 
             L 216 192 
             L 256 192 
             C 269.255 192 280 202.745 280 216 
             L 280 256 
             C 280 269.255 269.255 280 256 280 
             L 216 280 
             L 216 416 
             C 216 429.255 205.255 440 192 440 
             L 160 440 
             C 146.745 440 136 429.255 136 416 
             Z" 
          fill="url(#leftStemGrad)" />

    <!-- RIGHT VERTICAL PILLAR OF 'H' (Seamlessly incorporates Right Arm of Medical Cross) -->
    <path d="M 320 96 
             C 320 82.745 330.745 72 344 72 
             L 376 72 
             C 389.255 72 400 82.745 400 96 
             L 400 416 
             C 400 429.255 389.255 440 376 440 
             L 344 440 
             C 330.745 440 320 429.255 320 416 
             L 320 320 
             L 256 320 
             C 242.745 320 232 309.255 232 296 
             L 232 256 
             C 232 242.745 242.745 232 256 232 
             L 320 232 
             Z" 
          fill="url(#rightStemGrad)" />

    <!-- CENTER TOP & BOTTOM CROSS EXTENSIONS (Completing the Cross Core with Flowing Curves) -->
    <!-- Top Vertical Arm of the Cross integrated with the Crossbar -->
    <path d="M 216 192 
             L 216 152 
             C 216 138.745 226.745 128 240 128 
             L 272 128 
             C 285.255 128 296 138.745 296 152 
             L 296 192 
             Z" 
          fill="url(#crossBarGrad)" />

    <!-- Bottom Vertical Arm of the Cross -->
    <path d="M 216 320 
             L 296 320 
             L 296 360 
             C 296 373.255 285.255 384 272 384 
             L 240 384 
             C 226.745 384 216 373.255 216 360 
             Z" 
          fill="url(#leftStemGrad)" 
          opacity="0.95" />

    <!-- SMOOTH MODERN OVERLAY BRIDGING THE CENTER (Creates the 3D/Fluid Merge Effect) -->
    <!-- Central Crossbar Section connecting H and Cross into a single fluid structure -->
    <path d="M 192 216 
             C 192 202.745 202.745 192 216 192 
             L 296 192 
             C 309.255 192 320 202.745 320 216 
             L 320 296 
             C 320 309.255 309.255 320 296 320 
             L 216 320 
             C 202.745 320 192 309.255 192 296 
             Z" 
          fill="url(#crossBarGrad)" />

    <!-- SWOOSH / VITAL SIGN WAVE ACCENT (Adds modern tech/life motif seamlessly across the H-Cross) -->
    <path d="M 136 256 
             C 176 256 192 208 232 208 
             C 264 208 272 288 304 288 
             C 336 288 352 256 400 256
             L 400 280
             C 360 280 344 312 304 312
             C 264 312 256 232 232 232
             C 200 232 176 280 136 280 Z" 
          fill="url(#accentGrad)" 
          opacity="0.35" />

    <!-- CORE HIGHLIGHT: Sleek Geometry Cutouts for Precision & Modern Aesthetics -->
    <!-- Top-Left Inner Corner Fillet -->
    <path d="M 216 192 A 24 24 0 0 0 192 216 L 216 216 Z" fill="#00E5FF" opacity="0.4" />
    
    <!-- Bottom-Right Inner Corner Fillet -->
    <path d="M 296 320 A 24 24 0 0 0 320 296 L 296 296 Z" fill="#03045E" opacity="0.2" />

    <!-- Minimalist Dynamic Pulse Spark (Center-right of the cross) -->
    <circle cx="356" cy="216" r="10" fill="#00E5FF" />
  </g>
</svg>
